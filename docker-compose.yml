---
# AlgoPlutus — Production Docker Compose
# Usage: docker compose --env-file .env up -d

networks:
  algoplutus:
    driver: bridge

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1) CCXT Proxy — serves yfinance data as Binance API + Dhan orders
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ccxt_proxy:
    build:
      context: ./user_data/proxy
      dockerfile: Dockerfile
    container_name: algoplutus_proxy
    networks: [algoplutus]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DHAN_CLIENT_ID=${DHAN_CLIENT_ID}
      - DHAN_ACCESS_TOKEN=${DHAN_ACCESS_TOKEN}
      - DRY_RUN=${DRY_RUN:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2) Freqtrade Bot — FreqAI LightGBM trading engine
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  freqtrade:
    build:
      context: .
      dockerfile: docker/Dockerfile.custom
    container_name: algoplutus_bot
    networks: [algoplutus]
    depends_on:
      ccxt_proxy:
        condition: service_healthy
    env_file: .env
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config_freqai.json
      --strategy FreqAI_IndianMarket
      --freqaimodel LightGBMRegressor
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, base64; req=urllib.request.Request('http://localhost:8080/api/v1/ping'); req.add_header('Authorization', 'Basic '+base64.b64encode(b'freqtrader:AlgoPlutus@2026!').decode()); urllib.request.urlopen(req)"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 3) Session Controller — market hours + Telegram alerts
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  session_controller:
    build:
      context: .
      dockerfile: docker/Dockerfile.session
    container_name: algoplutus_session
    networks: [algoplutus]
    depends_on:
      freqtrade:
        condition: service_healthy
    env_file: .env
    environment:
      - PROXY_URL=http://ccxt_proxy:8000/health
      - FT_API_URL=http://freqtrade:8080/api/v1
      - FT_API_USERNAME=${FT_API_USERNAME:-freqtrader}
      - FT_API_PASSWORD=${FT_API_PASSWORD}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LOG_PATH=/freqtrade/user_data/logs/session_controller.log
    volumes:
      - "./user_data:/freqtrade/user_data"
    restart: unless-stopped
    command: ["python", "-u", "/app/session_controller.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 4) Risk Manager — enforces daily loss limits, P&L CSV
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  risk_manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.session
    container_name: algoplutus_risk
    networks: [algoplutus]
    depends_on:
      freqtrade:
        condition: service_healthy
    env_file: .env
    environment:
      - FT_API_URL=http://freqtrade:8080/api/v1
      - FT_API_USERNAME=${FT_API_USERNAME:-freqtrader}
      - FT_API_PASSWORD=${FT_API_PASSWORD}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MAX_DAILY_LOSS_PCT=${MAX_DAILY_LOSS_PCT:-0.02}
      - MAX_TRADE_SIZE_INR=${MAX_TRADE_SIZE_INR:-50000}
      - LOG_PATH=/freqtrade/user_data/logs/risk_manager.log
    volumes:
      - "./user_data:/freqtrade/user_data"
    restart: unless-stopped
    command: ["python", "-u", "/app/risk_manager.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
